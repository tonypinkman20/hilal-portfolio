# Pages CMS paneli: https://app.pagescms.org
media:
  name: images
  label: Görseller
  input: assets/uploads
  output: /uploads
  rename: safe
  # HEIC gibi Hugo'nun işleyemediği biçimler build'i bozmasın.
  extensions: [png, jpg, jpeg, webp]

settings:
  # Formda olmayan alanlar (menü, sıra vb.) kaydederken silinmesin.
  content:
    merge: true

content:
  - name: site-gorunumu
    label: Site Görünümü
    type: file
    path: config/_default/params.yaml
    format: yaml
    fields:
      - name: sidebar
        label: Kenar menü
        type: object
        fields:
          - name: avatar
            label: Logo
            description: Otomatik olarak kare kırpılır ve küçültülür.
            type: image
            required: true
            options:
              media: images
          - name: subtitle
            label: Logonun altındaki yazı
            type: string
      - name: favicon
        label: Favicon (tarayıcı sekmesindeki küçük simge)
        description: Otomatik olarak kare kırpılır ve küçültülür. Logo ile aynı görsel de seçilebilir.
        type: image
        required: true
        options:
          media: images
      - name: footer
        label: Sayfa altı (footer)
        type: object
        fields:
          - name: owner
            label: Telif satırındaki ad
            description: Örnek çıktı "© 2026 Hilal".
            type: string
          - name: since
            label: Başlangıç yılı
            description: Bu yıldan farklıysa "2024 - 2026" gibi görünür.
            type: number
            options:
              min: 2000
          - name: customText
            label: Ek yazı
            description: 'İsteğe bağlı. Bağlantı eklemek için [Instagram](https://instagram.com/kullanici) biçimini kullanın.'
            type: string

  - name: projeler
    label: Projeler
    type: collection
    path: content/post
    subfolders: false
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date]
      sort: date
      order: desc
    fields:
      - name: title
        label: Proje adı
        type: string
        required: true
      - name: description
        label: Kısa açıklama
        type: text
      - name: date
        label: Tarih
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: image
        label: Kapak görseli
        type: image
        options:
          media: images
      - name: categories
        label: Kategori
        type: select
        options:
          multiple: true
          values: [Tasarım, Fotoğraf, Web]
      - name: body
        label: Proje yazısı
        type: rich-text
        options:
          media: images
          format: markdown

  - name: hakkimda
    label: Hakkımda
    type: file
    path: content/page/hakkimda/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Sayfa başlığı
        type: string
        required: true
      - name: description
        label: Kısa açıklama
        type: text
      - name: body
        label: Sayfa içeriği
        type: rich-text
        options:
          media: images
          format: markdown

  - name: iletisim
    label: İletişim
    type: file
    path: content/page/iletisim/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Sayfa başlığı
        type: string
        required: true
      - name: description
        label: Kısa açıklama
        type: text
      - name: body
        label: Sayfa içeriği
        type: rich-text
        options:
          media: images
          format: markdown
